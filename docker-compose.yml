services:
  mysql-db:
    image: mysql:8.0
    container_name: fincontrol-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=fincontrol
      - MYSQL_USER=finuser
      - MYSQL_PASSWORD=finpass
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  adminer:
    image: adminer
    container_name: fincontrol-adminer
    ports:
      - "8081:8080"
    depends_on:
      mysql-db:
        condition: service_healthy

  app:
    build:
      context: .
    container_name: fincontrol-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/fincontrol?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=finuser
      - SPRING_DATASOURCE_PASSWORD=finpass
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: always
