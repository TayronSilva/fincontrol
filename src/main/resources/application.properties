spring.application.name=fincontrol
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fincontrol?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finpass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.fincontrol.api.fincontrol

